name: automarket

# ═══════════════════════════════════════════════════════════
# Локальная разработка.
# База — Neon (DATABASE_URL в .env), парсеры — GitHub Actions,
# деплой — Render (см. render.yaml). Здесь только backend + frontend
# для итерации по коду и UI.
# ═══════════════════════════════════════════════════════════

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *restart-policy
    env_file: .env
    # DATABASE_URL в .env указывает на Neon (SSL, pooled).
    # POSTGRES_* можно не задавать — backend/app/core/config.py
    # приоритетно использует DATABASE_URL.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    <<: *restart-policy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

services:
  # ─────────────────────────────────────────
  # Backend: FastAPI web service (free, sleeps after 15 min)
  # ─────────────────────────────────────────
  - type: web
    name: kolesa-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: ALGORITHM
        value: HS256

  # ─────────────────────────────────────────
  # Frontend: Next.js static export (free, unlimited, never sleeps)
  # ─────────────────────────────────────────
  - type: web
    name: kolesa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

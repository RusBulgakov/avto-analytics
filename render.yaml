services:
  # ─────────────────────────────────────────
  # Backend: FastAPI web service (free, sleeps after 15 min)
  # ─────────────────────────────────────────
  - type: web
    name: kolesa-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: ALGORITHM
        value: HS256
      # Sentry DSN бэкенда (t-0006). Пусто/не задано ⇒ Sentry выключен
      - key: SENTRY_DSN
        sync: false

  # ─────────────────────────────────────────
  # Frontend: Next.js static export (free, unlimited, never sleeps)
  # ─────────────────────────────────────────
  - type: web
    name: kolesa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Публичный URL фронта для canonical/OG-тегов и sitemap/robots
      # (если не задан — fallback https://kolesa-frontend.onrender.com)
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Sentry DSN фронта (t-0006), инлайнится в бандл на билде.
      # Пусто/не задано ⇒ Sentry выключен
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
    # ВАЖНО: catch-all rewrite /* → /index.html ломал deep-links — Render отдавал
    # дашборд для ЛЮБОГО пути (/brands, /listing?id=, /auth/login и т.д.).
    # Next.js static export кладёт в out/ отдельные .html на каждую страницу,
    # Render Static сам отдаёт brands.html для /brands. Rewrite не нужен.

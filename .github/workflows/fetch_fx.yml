name: Fetch FX rates (NBK)

# Daily fetch USD/KZT + EUR/RUB/CNY с National Bank of Kazakhstan API.
# Хранит в fx_history table — используется /forecast endpoint для USD-нормализованной regression.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 11:00 Астана. NBK публикует rates с раннего утра.
  workflow_dispatch:
    inputs:
      days:
        description: 'Сколько дней назад догружать'
        required: false
        default: '7'

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  fetch-fx:
    name: Fetch USD/KZT from NBK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        run: pip install -r parsers/requirements.txt

      - name: Fetch FX rates
        run: python -m parsers.common.fetch_fx
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FX_BACKFILL_DAYS: ${{ github.event.inputs.days || '7' }}

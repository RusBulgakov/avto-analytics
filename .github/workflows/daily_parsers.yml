name: Daily Parsers

on:
  schedule:
    - cron: '0 3 * * *'  # ежедневно в 03:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: 'Запустить конкретный парсер (или all для всех)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - kolesa
          - mycar
          - newauto
          - avtorynok
          - olx

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:

  # ─────────────────────────────────────────
  # Шаг 1: Обновление пула прокси
  # ─────────────────────────────────────────
  refresh-proxies:
    name: 🔄 Refresh Proxy Pool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        run: pip install -r parsers/requirements.txt

      - name: Refresh proxies
        run: python -m parsers.common.refresh_proxies

  # ─────────────────────────────────────────
  # Шаг 2: Параллельный запуск парсеров
  # ─────────────────────────────────────────
  parse-all:
    name: 🕷️ Parse ${{ matrix.source }}
    needs: refresh-proxies
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 5.5 часов — Kolesa может занять до 5 часов
    if: always() && needs.refresh-proxies.result != 'cancelled'
    strategy:
      fail-fast: false  # если один парсер упал — остальные продолжают
      matrix:
        source: [kolesa, mycar, newauto, avtorynok, olx]

    steps:
      - name: Check if this parser should run
        id: check
        run: |
          INPUT_SOURCE="${{ github.event.inputs.source || 'all' }}"
          if [ "$INPUT_SOURCE" = "all" ] || [ "$INPUT_SOURCE" = "${{ matrix.source }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.should_run == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pip install -r parsers/requirements.txt

      - name: Run ${{ matrix.source }} parser
        if: steps.check.outputs.should_run == 'true'
        run: python -m parsers.${{ matrix.source }}.parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PARSER_REQUEST_DELAY_MIN: 3
          PARSER_REQUEST_DELAY_MAX: 6
          PARSER_MAX_RETRIES: 3

  # ─────────────────────────────────────────
  # Шаг 3: Деактивация старых объявлений
  # ─────────────────────────────────────────
  deactivate-old:
    name: 🧹 Deactivate Old Listings
    needs: parse-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && needs.parse-all.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        run: pip install -r parsers/requirements.txt

      - name: Deactivate old listings
        run: python -m parsers.common.deactivate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

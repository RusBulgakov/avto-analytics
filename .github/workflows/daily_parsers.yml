name: Daily Parsers (light)

# Лёгкие парсеры — mycar, newauto, avtorynok, olx.
# Каждый укладывается в 60–120 минут → можно гонять каждые 6 часов.
#
# Тяжёлый kolesa.kz вынесен в отдельный workflow (kolesa_full.yml),
# потому что его полный прогон занимает ~10 часов и требует шардирования.

on:
  schedule:
    - cron: '0 */6 * * *'  # каждые 6 часов (00/06/12/18 UTC = 05/11/17/23 Астана)
  workflow_dispatch:
    inputs:
      source:
        description: 'Запустить конкретный парсер (или all для всех)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mycar
          - newauto
          - avtorynok
          - olx

concurrency:
  group: daily-parsers-light
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:

  # ─────────────────────────────────────────
  # Шаг 1: Обновление пула прокси
  # ─────────────────────────────────────────
  refresh-proxies:
    name: 🔄 Refresh Proxy Pool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        run: pip install -r parsers/requirements.txt

      - name: Refresh proxies
        run: python -m parsers.common.refresh_proxies

  # ─────────────────────────────────────────
  # Шаг 2: Параллельный запуск лёгких парсеров
  # ─────────────────────────────────────────
  parse-all:
    name: 🕷️ Parse ${{ matrix.source }}
    needs: refresh-proxies
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: always() && needs.refresh-proxies.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        source: [mycar, newauto, avtorynok, olx]

    steps:
      - name: Check if this parser should run
        id: check
        run: |
          INPUT_SOURCE="${{ github.event.inputs.source || 'all' }}"
          if [ "$INPUT_SOURCE" = "all" ] || [ "$INPUT_SOURCE" = "${{ matrix.source }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.should_run == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pip install -r parsers/requirements.txt

      - name: Run ${{ matrix.source }} parser
        if: steps.check.outputs.should_run == 'true'
        run: python -m parsers.${{ matrix.source }}.parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PARSER_REQUEST_DELAY_MIN: 3
          PARSER_REQUEST_DELAY_MAX: 6
          PARSER_MAX_RETRIES: 3

  # ─────────────────────────────────────────
  # Шаг 3: Деактивация старых объявлений (light-парсеры)
  # ─────────────────────────────────────────
  # Запускается ТОЛЬКО при успешном завершении light-парсеров.
  # Иначе сохраняем существующие данные — лучше немного stale, чем потерять всё.
  #
  # CRITICAL: deactivate ИСКЛЮЧАЕТ kolesa (DEACTIVATE_EXCLUDE_SOURCES=kolesa).
  # Причина: этот workflow не парсит kolesa (он запускается каждые 6 часов).
  # Если kolesa_full упал → kolesa-объявления стареют → этот deactivate
  # массово сносил свежие данные kolesa (53k → 49k active за один прогон).
  # Свой deactivate для kolesa живёт в kolesa_full.yml и работает только
  # после успешного прогона ВСЕХ 3 шардов.
  deactivate-old:
    name: 🧹 Deactivate Old Listings (non-kolesa)
    needs: parse-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: success()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        run: pip install -r parsers/requirements.txt

      - name: Deactivate old listings (excluding kolesa)
        run: python -m parsers.common.deactivate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Не трогаем kolesa: его deactivate живёт в kolesa_full.yml.
          # Иначе падение тяжёлого парсера убивает 4k+ активных объявлений.
          DEACTIVATE_EXCLUDE_SOURCES: kolesa

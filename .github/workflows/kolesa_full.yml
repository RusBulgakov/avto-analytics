name: Kolesa Full Parse (sharded)

# Отдельный workflow для kolesa.kz — самого тяжёлого источника.
# 297 фидов в одном job не влезает (GHA лимит 360 мин).
# Решение: шардирование на 3 параллельных job'а × ~99 фидов × ~3.5ч каждый.
#
# Constraint: kolesa.kz блокирует IP из Azure-датацентра GitHub Actions
# при >6 одновременных запросах. Балансируем шарды × concurrency:
#
#   Было: 2 шарда × 3 concurrency = 6 simultaneous, ~5ч wall-clock
#   Стало: 3 шарда × 2 concurrency = 6 simultaneous, ~3.5ч wall-clock
#
# Total simultaneous то же, kolesa не банит. Wall-clock быстрее за счёт
# параллелизма jobs (3 одновременно вместо 2).
#
# После УСПЕШНОГО завершения ВСЕХ 3 шардов → запускается deactivate-old.
# Если хоть один шард упал/прерван → deactivate НЕ запускается,
# чтобы не помечать inactive то, что не успели обновить (сохраняем данные).

on:
  schedule:
    # Два прогона в сутки — повышает свежесть данных вдвое
    # 20:00 UTC = 01:00 Астана (ночь)
    # 08:00 UTC = 13:00 Астана (день)
    - cron: '0 20 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      shard_count:
        description: 'Количество шардов (по умолчанию 3)'
        required: false
        default: '3'

# Не запускать параллельно — если предыдущий прогон ещё идёт, новый встанет в очередь.
# cancel-in-progress: false — не убиваем начатый прогон,
# потому что данные уже сохраняются в БД и рвать их на полпути невыгодно.
concurrency:
  group: kolesa-full
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  SHARD_COUNT: ${{ github.event.inputs.shard_count || '3' }}

jobs:

  # ─────────────────────────────────────────
  # Шаг 1: Параллельный запуск шардов kolesa
  # ─────────────────────────────────────────
  kolesa-shard:
    name: 🕷️ Kolesa shard ${{ matrix.shard_index }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5.8 ч — запас над ожидаемыми 3.5ч на шард (99 фидов)
    strategy:
      fail-fast: false   # если один шард упал — остальные продолжают работать
      matrix:
        # Если меняешь SHARD_COUNT — синхронизируй этот список!
        shard_index: [0, 1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        run: pip install -r parsers/requirements.txt

      - name: Run kolesa parser (shard ${{ matrix.shard_index }})
        run: python -m parsers.kolesa.parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KOLESA_SHARD_INDEX: ${{ matrix.shard_index }}
          KOLESA_SHARD_COUNT: 3
          # Concurrency 3→2: компенсирует увеличение шардов (2→3) чтобы
          # сохранить total simultaneous = 6 (предел kolesa anti-bot).
          KOLESA_CITY_CONCURRENCY: 2
          # Smoke-check: парсер exit 1 если сохранит < этого порога
          # (значит IP заблокирован и запускать deactivate нельзя).
          # 1 шард = 96 фидов, локально один процесс даёт 16k+ за 5ч,
          # 1000 — очень консервативный минимум.
          MIN_SAVED_THRESHOLD: 1000
          PARSER_REQUEST_DELAY_MIN: 3
          PARSER_REQUEST_DELAY_MAX: 6
          PARSER_MAX_RETRIES: 3

  # ─────────────────────────────────────────
  # Шаг 2: Деактивация старых объявлений
  # ─────────────────────────────────────────
  # Запускается ТОЛЬКО если ВСЕ шарды успешны (needs.result == success).
  # Иначе — держим данные как есть, чтобы не терять объявления из незавершённых шардов.
  deactivate-old:
    name: 🧹 Deactivate Old Listings
    needs: kolesa-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: success()  # только при полном успехе всех шардов
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        run: pip install -r parsers/requirements.txt

      - name: Deactivate old listings (kolesa only)
        run: python -m parsers.common.deactivate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Скоупим только kolesa: остальные source живут на своём расписании
          # в daily_parsers.yml. Без этого deactivate сносил свежие mycar/olx,
          # если они отстали на 168ч (а они часто могут).
          DEACTIVATE_SOURCE: kolesa

  # ─────────────────────────────────────────
  # Шаг 3: Auto-trigger alive_check после deactivate
  # ─────────────────────────────────────────
  # Сразу после deactivate запускаем alive_check, который оживит
  # ложно-деактивированные (которые kolesa всё ещё показывает).
  # Это закрывает gap между парсером (видит фид) и алайв-чеком (видит URL).
  trigger-alive-check:
    name: 🫀 Trigger alive_check
    needs: [kolesa-shard, deactivate-old]
    runs-on: ubuntu-latest
    if: always() && needs.kolesa-shard.result == 'success'
    steps:
      - name: Dispatch alive_check workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Alive Check (Kolesa)" --ref ${{ github.ref_name }} \
            -f batch=10000 || echo "Не удалось запустить alive_check (не критично)"

  # ─────────────────────────────────────────
  # Шаг 4: Итоговое уведомление в Telegram
  # ─────────────────────────────────────────
  summary:
    name: 📊 Send summary to Telegram
    needs: [kolesa-shard, deactivate-old]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify final status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KOLESA_RESULT: ${{ needs.kolesa-shard.result }}
          DEACTIVATE_RESULT: ${{ needs.deactivate-old.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not set — skipping"
            exit 0
          fi

          if [ "$KOLESA_RESULT" = "success" ] && [ "$DEACTIVATE_RESULT" = "success" ]; then
            ICON="✅"; TEXT="Kolesa full run: шарды + деактивация — OK"
          elif [ "$KOLESA_RESULT" = "success" ]; then
            ICON="⚠️"; TEXT="Kolesa: шарды OK, деактивация = $DEACTIVATE_RESULT"
          else
            ICON="🔴"; TEXT="Kolesa: шарды = $KOLESA_RESULT (деактивация пропущена — IP блок или мало данных)"
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d text="$ICON <b>Kolesa Full Run</b>%0A$TEXT%0A%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

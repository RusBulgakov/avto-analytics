name: DB Guard (Neon capacity + spool replay)

# Страховка «данные собираются всегда» (2026-09-25, после недели DiskFullError):
#
# 1. Capacity: ранний сигнал в Telegram, когда кластер Neon подходит к лимиту
#    free tier 512 MB (порог NEON_WARN_MB). Раньше узнавали по уже упавшим
#    парсерам — через несколько суток потерь.
# 2. Replay: парсеры при сбое записи в БД складывают объявления в спул
#    (parsers/common/spool.py) и заливают его артефактом `spool-*`. Здесь
#    артефакты скачиваются и доливаются в БД с исходным временем наблюдения
#    (parsers/common/replay_spool.py). Успешно долитые артефакты удаляются;
#    если БД всё ещё не принимает запись — остаются до следующего запуска
#    (retention 30 дней).

on:
  schedule:
    - cron: '40 */3 * * *'   # каждые 3 часа
  workflow_dispatch:

permissions:
  actions: write   # скачать и удалить артефакты спула
  contents: read

concurrency:
  group: db-guard
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  guard:
    name: 🛡️ Neon capacity + spool replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        run: pip install -r parsers/requirements.txt

      - name: Neon capacity check
        run: python -m parsers.common.neon_capacity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEON_LIMIT_MB: 512
          NEON_WARN_MB: 470

      - name: Download pending spool artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p spool_in
          gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.name | startswith("spool-")) | select(.expired | not) | .id' \
            | sort -n > pending.txt
          echo "pending spool artifacts: $(wc -l < pending.txt)"
          while read -r id; do
            [ -n "$id" ] || continue
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "a_$id.zip"
            unzip -q -o "a_$id.zip" -d "spool_in/$id"
            rm -f "a_$id.zip"
          done < pending.txt

      - name: Replay spool into DB
        run: python -m parsers.common.replay_spool spool_in --done-file replayed.txt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Delete replayed artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [ -f replayed.txt ] || { echo "nothing replayed"; exit 0; }
          while read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "deleted artifact $id" \
              || echo "::warning::не удалось удалить артефакт $id (дольётся повторно — долив идемпотентен)"
          done < replayed.txt
